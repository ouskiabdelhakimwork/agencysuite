# Configuration commune. Aucun secret ici : les secrets viennent des variables
# d'environnement ou du coffre de secrets (06-conventions-code.md).
spring:
  application:
    name: agencysuite
  config:
    # En local uniquement : reprend les mots de passe de deploy/.env (fichier ignore par Git).
    # Sans effet si le fichier n'existe pas (recette, production, CI).
    import: optional:file:../deploy/.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agencysuite}
    username: ${DB_USERNAME:${POSTGRES_USER:agencysuite}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:}}
  jpa:
    # Pas de session JPA ouverte pendant le rendu de la reponse HTTP
    open-in-view: false
    hibernate:
      # Le schema est gere par Flyway ; Hibernate verifie seulement qu'il correspond aux entites
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  mvc:
    problemdetails:
      # Erreurs au format RFC 9457 (application/problem+json)
      enabled: true
  threads:
    virtual:
      # Threads virtuels (Java 21+) : beaucoup de requetes concurrentes sans grossir le pool
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        # Sondes liveness/readiness pour Kubernetes
        enabled: true

springdoc:
  paths-to-match: /api/**

agencysuite:
  security:
    # Emetteurs des jetons Keycloak (adresses publiques, pas des secrets). Les cles publiques
    # sont lues sur <issuer>/protocol/openid-connect/certs a la premiere requete authentifiee.
    agency-issuer: ${KEYCLOAK_AGENCY_ISSUER:http://localhost:8180/realms/agencysuite}
    platform-issuer: ${KEYCLOAK_PLATFORM_ISSUER:http://localhost:8180/realms/platform}
    audience: agencysuite-api
  keycloak-admin:
    # API d'administration Keycloak, compte de service du client confidentiel agencysuite-backend
    # (etape 3, lot 5). Le secret n'est jamais dans le depot : variable d'environnement, en local
    # deploy/.env. Sans secret, l'application demarre et les invitations repondent 503.
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
    realm: agencysuite
    client-id: agencysuite-backend
    client-secret: ${KEYCLOAK_BACKEND_CLIENT_SECRET:}
    invitation-lifespan: PT72H
    app-base-url: ${APP_BASE_URL:http://localhost:4200}
