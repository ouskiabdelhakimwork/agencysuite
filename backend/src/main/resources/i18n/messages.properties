# Langue par defaut : francais. Fichiers en UTF-8.
# Apostrophe typographique (’) : evite l'echappement MessageFormat des messages a parametres.
platform.welcome=Bienvenue sur AgencySuite

# Erreurs (RFC 9457) : problem.<code>.title / problem.<code>.detail
problem.subdomain-taken.title=Sous-domaine déjà utilisé
problem.subdomain-taken.detail=Ce sous-domaine est déjà attribué à une autre agence. Choisissez-en un autre.
problem.not-found.title=Ressource introuvable
problem.not-found.detail=La ressource demandée (agence, palier, module, utilisateur, client, contact ou voyageur) n’existe pas.
problem.module-not-enabled.title=Module non activé
problem.module-not-enabled.detail=Le module {0} n’est pas activé pour votre agence.
problem.agency-scope-required.title=Agence requise
problem.agency-scope-required.detail=Cette opération est réservée aux utilisateurs d’une agence.
problem.unauthenticated.title=Authentification requise
problem.unauthenticated.detail=Connectez-vous pour accéder à cette ressource.
problem.access-denied.title=Accès refusé
problem.access-denied.detail=Vous n’avez pas accès à cette ressource.
problem.permission-denied.title=Permission insuffisante
problem.permission-denied.detail=Votre rôle ne vous donne pas la permission {0} nécessaire pour cette opération.
problem.agency-unavailable.title=Agence indisponible
problem.agency-unavailable.detail=L’accès à votre agence n’est pas disponible. Contactez le support AgencySuite.
problem.invalid-subdomain.title=Sous-domaine invalide
problem.invalid-subdomain.detail=Le sous-domaine doit comporter 3 à 63 caractères (lettres minuscules, chiffres et tirets, sans tiret au début ni à la fin) et ne pas être un nom réservé (www, api, admin…).
problem.email-already-registered.title=E-mail déjà enregistré
problem.email-already-registered.detail=Un utilisateur possède déjà cette adresse e-mail.
problem.user-quota-exceeded.title=Nombre d’utilisateurs atteint
problem.user-quota-exceeded.detail=Le palier de l’agence ne permet pas d’utilisateur supplémentaire. Désactivez un utilisateur ou changez de palier.
problem.last-manager.title=Dernier gérant
problem.last-manager.detail=L’agence doit garder au moins un gérant actif ou invité.
problem.cannot-disable-self.title=Action impossible sur votre compte
problem.cannot-disable-self.detail=Vous ne pouvez pas désactiver votre propre compte.
problem.user-not-invited.title=Utilisateur non invité
problem.user-not-invited.detail=Cet utilisateur a déjà activé son compte ou est désactivé : l’invitation ne peut pas être renvoyée.
problem.agency-closed.title=Agence close
problem.agency-closed.detail=Cette agence est close : aucun utilisateur ne peut y être ajouté.
problem.identity-admin-unavailable.title=Service d’identité indisponible
problem.identity-admin-unavailable.detail=La gestion des comptes est momentanément indisponible. Réessayez plus tard.
problem.possible-duplicate.title=Doublon probable
problem.possible-duplicate.detail=Une fiche existe déjà avec le même e-mail, téléphone, ICE, ou le même nom et la même date de naissance. Vérifiez les fiches proposées, ou confirmez pour enregistrer quand même.
problem.stale-version.title=Fiche modifiée entre-temps
problem.stale-version.detail=La fiche a été modifiée par quelqu’un d’autre ; rechargez-la.
problem.contacts-company-only.title=Contacts réservés aux entreprises
problem.contacts-company-only.detail=Seul un client entreprise peut avoir des contacts.
problem.customer-has-contacts.title=Client avec des contacts
problem.customer-has-contacts.detail=Cette entreprise a des contacts : supprimez-les avant d’en faire un particulier.
problem.invalid-owner.title=Responsable inconnu
problem.invalid-owner.detail=Le responsable choisi n’est pas un utilisateur de votre agence.
problem.customer-archived.title=Client archivé
problem.customer-archived.detail=Ce client est archivé : restaurez-le avant d’y rattacher un voyageur.

# Erreurs standard de Spring (lecture du corps JSON, Bean Validation) : type, titre et detail traduits
problemDetail.type.org.springframework.http.converter.HttpMessageNotReadableException=urn:agencysuite:problem:malformed-request
problemDetail.title.org.springframework.http.converter.HttpMessageNotReadableException=Requête illisible
problemDetail.org.springframework.http.converter.HttpMessageNotReadableException=Le corps de la requête n’est pas un JSON valide ou contient une valeur non reconnue (par exemple un code de module inconnu).
problemDetail.type.org.springframework.web.bind.MethodArgumentNotValidException=urn:agencysuite:problem:validation-failed
problemDetail.title.org.springframework.web.bind.MethodArgumentNotValidException=Données invalides
problemDetail.org.springframework.web.bind.MethodArgumentNotValidException=Un ou plusieurs champs sont manquants ou invalides.
problemDetail.type.org.springframework.web.method.annotation.HandlerMethodValidationException=urn:agencysuite:problem:validation-failed
problemDetail.title.org.springframework.web.method.annotation.HandlerMethodValidationException=Données invalides
problemDetail.org.springframework.web.method.annotation.HandlerMethodValidationException=Un ou plusieurs paramètres sont manquants ou invalides.
