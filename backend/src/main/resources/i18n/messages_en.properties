# English. UTF-8 file.
platform.welcome=Welcome to AgencySuite

# Errors (RFC 9457): problem.<code>.title / problem.<code>.detail
problem.subdomain-taken.title=Subdomain already taken
problem.subdomain-taken.detail=This subdomain is already assigned to another agency. Please choose another one.
problem.not-found.title=Resource not found
problem.not-found.detail=The requested resource (agency, plan, module, user, customer, contact, traveler, supplier, product or rate) does not exist.
problem.module-not-enabled.title=Module not enabled
problem.module-not-enabled.detail=The {0} module is not enabled for your agency.
problem.agency-scope-required.title=Agency required
problem.agency-scope-required.detail=This operation is reserved for agency users.
problem.unauthenticated.title=Authentication required
problem.unauthenticated.detail=Sign in to access this resource.
problem.access-denied.title=Access denied
problem.access-denied.detail=You do not have access to this resource.
problem.permission-denied.title=Insufficient permission
problem.permission-denied.detail=Your role does not grant the {0} permission required for this operation.
problem.agency-unavailable.title=Agency unavailable
problem.agency-unavailable.detail=Access to your agency is not available. Please contact AgencySuite support.
problem.invalid-subdomain.title=Invalid subdomain
problem.invalid-subdomain.detail=The subdomain must be 3 to 63 characters long (lowercase letters, digits and hyphens, no leading or trailing hyphen) and must not be a reserved name (www, api, admin…).
problem.email-already-registered.title=E-mail already registered
problem.email-already-registered.detail=A user already has this e-mail address.
problem.user-quota-exceeded.title=User limit reached
problem.user-quota-exceeded.detail=The agency's plan does not allow another user. Disable a user or change plan.
problem.last-manager.title=Last manager
problem.last-manager.detail=The agency must keep at least one active or invited manager.
problem.cannot-disable-self.title=Not allowed on your own account
problem.cannot-disable-self.detail=You cannot disable your own account.
problem.user-not-invited.title=User not invited
problem.user-not-invited.detail=This user has already activated their account or is disabled: the invitation cannot be sent again.
problem.agency-closed.title=Agency closed
problem.agency-closed.detail=This agency is closed: no user can be added to it.
problem.identity-admin-unavailable.title=Identity service unavailable
problem.identity-admin-unavailable.detail=Account management is temporarily unavailable. Try again later.
problem.possible-duplicate.title=Possible duplicate
problem.possible-duplicate.detail=A record with the same email, phone, ICE, or the same name and date of birth already exists. Check the suggested records, or confirm to save it anyway.
problem.stale-version.title=Record changed in the meantime
problem.stale-version.detail=Someone else has changed this record; reload it.
problem.contacts-company-only.title=Contacts for companies only
problem.contacts-company-only.detail=Only a company customer can have contacts.
problem.customer-has-contacts.title=Customer has contacts
problem.customer-has-contacts.detail=This company has contacts: delete them before turning it into an individual.
problem.invalid-owner.title=Unknown owner
problem.invalid-owner.detail=The selected owner is not a user of your agency.
problem.customer-archived.title=Customer archived
problem.customer-archived.detail=This customer is archived: restore it before linking a traveler to it.
problem.supplier-archived.title=Supplier archived
problem.supplier-archived.detail=This supplier is archived: restore it before adding a product to it.
problem.product-archived.title=Product archived
problem.product-archived.detail=This product is archived: restore it before creating or changing its rates.
problem.rate-overlap.title=Overlapping rate periods
problem.rate-overlap.detail=An active rate of this product, for the same basis, already covers part of this period (dates included). Change or archive the conflicting rate.
problem.validation-failed.title=Invalid data
problem.validation-failed.amount.detail=Invalid amount: it must be a strictly positive decimal string, with at most 15 digits before the decimal point and no more decimals than the currency allows (no rounding), in a known ISO 4217 currency.

# Standard Spring errors (JSON body reading, Bean Validation)
problemDetail.type.org.springframework.http.converter.HttpMessageNotReadableException=urn:agencysuite:problem:malformed-request
problemDetail.title.org.springframework.http.converter.HttpMessageNotReadableException=Unreadable request
problemDetail.org.springframework.http.converter.HttpMessageNotReadableException=The request body is not valid JSON or contains an unrecognized value (for example an unknown module code).
problemDetail.type.org.springframework.web.bind.MethodArgumentNotValidException=urn:agencysuite:problem:validation-failed
problemDetail.title.org.springframework.web.bind.MethodArgumentNotValidException=Invalid data
problemDetail.org.springframework.web.bind.MethodArgumentNotValidException=One or more fields are missing or invalid.
problemDetail.type.org.springframework.web.method.annotation.HandlerMethodValidationException=urn:agencysuite:problem:validation-failed
problemDetail.title.org.springframework.web.method.annotation.HandlerMethodValidationException=Invalid data
problemDetail.org.springframework.web.method.annotation.HandlerMethodValidationException=One or more parameters are missing or invalid.
