# Erreurs (RFC 9457) : problem.<code>.title / problem.<code>.detail
problem.subdomain-taken.title=النطاق الفرعي مستخدم بالفعل
problem.subdomain-taken.detail=هذا النطاق الفرعي مخصص بالفعل لوكالة أخرى. يرجى اختيار نطاق آخر.
problem.not-found.title=المورد غير موجود
problem.not-found.detail=المورد المطلوب (وكالة أو باقة أو وحدة أو مستخدم أو عميل أو جهة اتصال أو مسافر أو مورّد أو خدمة أو سعر) غير موجود.
problem.module-not-enabled.title=الوحدة غير مفعّلة
problem.module-not-enabled.detail=الوحدة {0} غير مفعّلة لوكالتكم.
problem.agency-scope-required.title=الوكالة مطلوبة
problem.agency-scope-required.detail=هذه العملية مخصصة لمستخدمي الوكالات فقط.
problem.unauthenticated.title=تسجيل الدخول مطلوب
problem.unauthenticated.detail=يرجى تسجيل الدخول للوصول إلى هذا المورد.
problem.access-denied.title=تم رفض الوصول
problem.access-denied.detail=لا تملكون صلاحية الوصول إلى هذا المورد.
problem.permission-denied.title=صلاحية غير كافية
problem.permission-denied.detail=لا يمنحكم دوركم الصلاحية {0} اللازمة لهذه العملية.
problem.agency-unavailable.title=الوكالة غير متاحة
problem.agency-unavailable.detail=الوصول إلى وكالتكم غير متاح حاليًا. يرجى التواصل مع دعم AgencySuite.
problem.invalid-subdomain.title=نطاق فرعي غير صالح
problem.invalid-subdomain.detail=يجب أن يتكون النطاق الفرعي من 3 إلى 63 حرفًا (حروف لاتينية صغيرة وأرقام وشرطات، دون شرطة في البداية أو النهاية) وألا يكون اسمًا محجوزًا (www، api، admin…).
problem.email-already-registered.title=البريد الإلكتروني مسجل مسبقًا
problem.email-already-registered.detail=يوجد مستخدم لديه هذا البريد الإلكتروني بالفعل.
problem.user-quota-exceeded.title=تم بلوغ الحد الأقصى للمستخدمين
problem.user-quota-exceeded.detail=لا تسمح باقة الوكالة بمستخدم إضافي. قم بتعطيل مستخدم أو غيّر الباقة.
problem.last-manager.title=آخر مدير
problem.last-manager.detail=يجب أن تحتفظ الوكالة بمدير واحد على الأقل نشط أو مدعو.
problem.cannot-disable-self.title=إجراء غير ممكن على حسابك
problem.cannot-disable-self.detail=لا يمكنك تعطيل حسابك الخاص.
problem.user-not-invited.title=المستخدم غير مدعو
problem.user-not-invited.detail=قام هذا المستخدم بتفعيل حسابه أو تم تعطيله: لا يمكن إعادة إرسال الدعوة.
problem.agency-closed.title=الوكالة مغلقة
problem.agency-closed.detail=هذه الوكالة مغلقة: لا يمكن إضافة أي مستخدم إليها.
problem.identity-admin-unavailable.title=خدمة الهوية غير متاحة
problem.identity-admin-unavailable.detail=إدارة الحسابات غير متاحة مؤقتًا. أعد المحاولة لاحقًا.
problem.possible-duplicate.title=تكرار محتمل
problem.possible-duplicate.detail=توجد بطاقة بنفس البريد الإلكتروني أو الهاتف أو ICE، أو بنفس الاسم وتاريخ الميلاد. تحقّق من البطاقات المقترحة، أو أكّد للحفظ رغم ذلك.
problem.stale-version.title=تم تعديل البطاقة في الأثناء
problem.stale-version.detail=عدّل شخص آخر هذه البطاقة؛ أعد تحميلها.
problem.contacts-company-only.title=جهات الاتصال خاصة بالشركات
problem.contacts-company-only.detail=لا يمكن أن تكون جهات اتصال إلا لعميل من نوع شركة.
problem.customer-has-contacts.title=عميل لديه جهات اتصال
problem.customer-has-contacts.detail=لهذه الشركة جهات اتصال: احذفها قبل تحويلها إلى عميل فرد.
problem.invalid-owner.title=مسؤول غير معروف
problem.invalid-owner.detail=المسؤول المختار ليس مستخدمًا في وكالتك.
problem.customer-archived.title=عميل مؤرشف
problem.customer-archived.detail=هذا العميل مؤرشف: استعِده قبل ربط مسافر به.
problem.supplier-archived.title=مورّد مؤرشف
problem.supplier-archived.detail=هذا المورّد مؤرشف: استعِده قبل إضافة خدمة إليه.
problem.product-archived.title=خدمة مؤرشفة
problem.product-archived.detail=هذه الخدمة مؤرشفة: استعِدها قبل إنشاء أسعارها أو تعديلها.
problem.rate-overlap.title=فترات أسعار متداخلة
problem.rate-overlap.detail=يوجد سعر نشط لهذه الخدمة، بنفس الأساس، يغطي جزءًا من هذه الفترة (التواريخ مشمولة). عدّل السعر المتعارض أو أرشفه.
problem.validation-failed.title=بيانات غير صالحة
problem.validation-failed.amount.detail=مبلغ غير صالح: يجب أن يكون سلسلة عشرية موجبة تمامًا، بخمسة عشر رقمًا على الأكثر قبل الفاصلة، ودون أرقام عشرية أكثر مما تسمح به العملة (دون تقريب)، وبعملة معروفة وفق ISO 4217.

