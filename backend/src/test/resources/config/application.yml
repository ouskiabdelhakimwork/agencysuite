# Complements de configuration pour les tests uniquement (fusionnes avec application.yml).
spring:
  flyway:
    # Migrations de test (tables sondes) en plus des migrations de l'application
    locations: classpath:db/migration,classpath:db/test-migration

agencysuite:
  backoffice:
    # Back-office ouvert sans authentification : tests uniquement (jamais dans application.yml principal).
    # TODO(etape-3) : remplacer par un jeton du realm "platform" dans les tests.
    unsecured-access: true
