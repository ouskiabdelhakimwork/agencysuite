# Complements de configuration pour les tests uniquement (fusionnes avec application.yml).
spring:
  flyway:
    # Migrations de test (tables sondes) en plus des migrations de l'application
    locations: classpath:db/migration,classpath:db/test-migration

agencysuite:
  security:
    # Emetteurs figes pour les tests (independants d'un eventuel deploy/.env local), repris par
    # TestTokens. Aucun Keycloak n'est contacte : les tests utilisent des jetons simules.
    agency-issuer: https://keycloak.test/realms/agencysuite
    platform-issuer: https://keycloak.test/realms/platform
    audience: agencysuite-api
